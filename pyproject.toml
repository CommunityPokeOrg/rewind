[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rewind"
version = "0.1.0"
description = "A macOS local-first time tracker: passive app/window tracking with an EKG-style daily attention replay."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CommunityPokeOrg" }]
maintainers = [{ name = "CommunityPokeOrg" }]
keywords = ["time-tracking", "macos", "pyside6", "local-first", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.6",
    "pyobjc-framework-Cocoa>=10.0; platform_system=='Darwin'",
    "pyobjc-framework-Quartz>=10.0; platform_system=='Darwin'",
]

[project.urls]
Homepage = "https://github.com/CommunityPokeOrg/rewind"
Repository = "https://github.com/CommunityPokeOrg/rewind"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rewind = "rewind.app:main"

[tool.setuptools.packages.find]
include = ["rewind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
